services:
  - type: worker
    name: dim-essay-checker
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python essay_bot.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: TELEGRAM_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: DONATE_M10
        sync: false
      - key: DONATE_ABB
        sync: false
